# Why each baseline failure fails.
#
# Baselines (baselines/<target>.txt) are regenerated mechanically by
# `REFRESH=1 check_baseline.rb`, so a cause can't live inside them without
# being wiped on every refresh. It lives here instead, matched by regexp
# against the same "<file_path> # <full_description>" key.
#
# check_baseline.rb reports, per run, how many baseline entries each cause
# covers and which entries match none. An unattributed entry means "nobody has
# diagnosed this yet" — that is the number to drive down, because a baseline
# full of unexplained lines looks identical to a baseline full of understood
# limitations, and only one of those is acceptable to ship on.
#
# `confidence` is deliberately part of the record:
#   confirmed — reproduced in isolation, or the shared code path was read and
#               leaves no other possibility
#   likely    — the spec's own source makes the mechanism plain, but it has not
#               been reproduced against a booted app
#   unknown   — grouped by symptom only; needs a local boot to resolve
#
# Order matters: the first matching cause wins, so put narrow patterns first.
#
# Retire a cause once no baseline entry matches it, and a pattern once no entry
# needs it. Attribution only runs on baseline entries, so a kept cause cannot
# label a regression: a new failure fails the job unattributed either way.
# `git log -p` on this file recovers a retired cause and its diagnosis. The
# 2026-10-12 refresh (run 38261324053) retired backbone-model-race-on-click,
# layout-measuring-js, select-optgroup-invisible, multipart-content-loss,
# form-method-dialog and axe-and-html-validation.

selenium-only-api:
  confidence: confirmed
  summary: >-
    The spec reaches for Selenium's post-hoc switch_to.alert. The gem cannot
    honour it: Lightpanda arms a dialog response before the action that opens
    it, so there is nothing to accept afterwards, and the gem raises
    NotSupportedByDriverError pointing at accept_alert/accept_confirm. Fails by
    design. Solidus's split-shipment spec hits it once the optgroup bug (fixed
    upstream in #3058) no longer stops the flow earlier.
  patterns:
    - "undefined method [`']switch_to"
    - 'post-hoc switch_to\.alert'

select2-v3-flow:
  confidence: likely
  summary: >-
    A spec ends up hunting for select2's own DOM (input.select2-input.
    select2-focused, .select2-drop) and never finds it, so the dropdown never
    opened for that helper's click path. The gem's CLICK_JS wrapper descent
    (wishlist C13) fixed the container-click path into select2; the taxons
    display-order picker takes a third path again.
  reference: "wishlist C13"
  next_step: >-
    Boot solidus, run products/edit/taxons_spec.rb with console capture, and
    find which element the helper clicks and where select2 v3 binds the open
    handler for that widget. One entry.
  patterns:
    - 'select2-input|select2-focused|select2-drop'

address-state-not-toggled:
  confidence: unknown
  summary: >-
    Solidus swaps an address's state control with the country: a state_id
    <select> when the country has states, a state_name text input when it has
    none, and the selected state follows the customer picked on a new order.
    The field the spec waits for never becomes visible, so the swap or the
    refill does not run. Grouped by symptom only. The store-credit memo entry
    is the same shape on another widget: after an inline edit the new memo is
    in the DOM but still hidden, so the display/edit toggle does not flip back.
  next_step: >-
    Boot solidus, run customer_details_spec.rb "changes state field to text
    input" with console_logs and network.traffic, and check whether the
    country change requests the states API and whether its callback runs.
  patterns:
    - 'customer_details_spec\.rb # Customer Details editing an order selected country has no state'
    - 'new_order_spec\.rb # New Order when changing customer'
    - "store_credits_spec\\.rb # Store credits admin displaying a store credit details page lets edit store credit's memo"

ajax-partial-not-applied:
  confidence: likely
  summary: >-
    A control changes (a select, a checkbox, a payment-method radio) and the
    server-rendered partial or JS update that should follow never lands, so the
    page keeps its pre-change content. Seen on solidus's calculator fields, the
    new-credit-card form and the return-authorization rows. The gem does
    dispatch bubbling input/change events (SELECT_OPTION_JS), so the event
    dispatch itself is not the gap.
  next_step: >-
    Boot solidus, drive one of these by hand and watch Network#traffic plus
    console_logs — the question is whether the request is issued, whether it
    responds, and whether the response handler runs.
  patterns:
    - 'payments_spec\.rb # Payments'
    - 'configuration/shipping_methods_spec\.rb # Shipping Methods update can change the calculator'
    - 'return_authorizations_spec\.rb # ReturnAuthorizations'

search-returns-nothing:
  confidence: unknown
  summary: >-
    A search or filter form is submitted and the results page comes back
    without the expected row. Grouped by symptom only — not yet established
    whether the submission carries its parameters, or whether the results
    render and the assertion misses them.
  patterns:
    - 'products_spec\.rb # Products as admin user searching products'

js-component-not-rendering:
  confidence: likely
  summary: >-
    Forem's comment UI is made of Preact components. After a reply is
    submitted, the parent comment keeps its "replying" state, so the component
    tree is not updating. Same family as the readyState stall that took out the
    forem homepage, but on article pages.
  reference: "wishlist A10"
  patterns:
    - 'spec/system/comments/'

decidim-account-js:
  confidence: likely
  summary: >-
    Decidim's avatar widget shows both of its states at once, so "Remove"
    matches twice and Capybara raises Ambiguous. A visibility question: the
    hidden state is not recognised as hidden.
  patterns:
    - 'account_spec\.rb # Account when on the account page update avatar'
