# Why each baseline failure fails.
#
# Baselines (baselines/<target>.txt) are regenerated mechanically by
# `REFRESH=1 check_baseline.rb`, so a cause can't live inside them without
# being wiped on every refresh. It lives here instead, matched by regexp
# against the same "<file_path> # <full_description>" key.
#
# check_baseline.rb reports, per run, how many baseline entries each cause
# covers and which entries match none. An unattributed entry means "nobody has
# diagnosed this yet" — that is the number to drive down, because a baseline
# full of unexplained lines looks identical to a baseline full of understood
# limitations, and only one of those is acceptable to ship on.
#
# `confidence` is deliberately part of the record:
#   confirmed — reproduced in isolation, or the shared code path was read and
#               leaves no other possibility
#   likely    — the spec's own source makes the mechanism plain, but it has not
#               been reproduced against a booted app
#   unknown   — grouped by symptom only; needs a local boot to resolve
#
# Order matters: the first matching cause wins, so put narrow patterns first.
#
# Retire a cause once no baseline entry matches it, and a pattern once no entry
# needs it. Attribution only runs on baseline entries, so a kept cause cannot
# label a regression: a new failure fails the job unattributed either way.
# `git log -p` on this file recovers a retired cause and its diagnosis. The
# 2026-10-12 refresh (run 38261324053) retired backbone-model-race-on-click,
# layout-measuring-js, select-optgroup-invisible, multipart-content-loss,
# form-method-dialog and axe-and-html-validation. The 2026-10-14 diagnosis
# replaced address-state-not-toggled, ajax-partial-not-applied and
# search-returns-nothing with the causes it proved. The 2026-10-16 refresh
# (run 38886066850) retired jquery1-change-shim (window's GlobalEventHandlers,
# upstream #3958) and no-change-on-blur (change on blur, upstream #3952), both
# in the 1.0.1 floor. The 2026-11-08 refresh (run 42494980619, 0.17.1 on the
# 11745 nightly) retired campfire-lexxy-prompt-menu (the mention test passes),
# and customer-switch-refill and js-component-not-rendering, which no baseline
# entry matched any more.

selenium-textarea-text:
  confidence: confirmed
  summary: >-
    After a failed memo save the row stays in edit mode, so the memo text is
    hidden and the expected "Memo Lottery Won" can only come from the
    textarea's child text (its defaultValue, set by the previous successful
    save). Selenium's visible-text atom includes a textarea's child text;
    innerText, which this gem reads, does not, so the spec is written against
    a Selenium-only reading. Booted locally on 11912 (2026-11-08): the memo
    POSTs go 200 then the spec's stubbed 400, no console error, and
    `row.innerText` is "Memo\t". Stock solidus runs Firefox via Selenium.
    Chrome/Cuprite not run, but innerText excludes textarea content there too.
    Fails by design; matching Selenium would diverge from Chrome.
  patterns:
    - "store_credits_spec\\.rb # Store credits admin displaying a store credit details page lets edit store credit's memo"

selenium-only-api:
  confidence: confirmed
  summary: >-
    The spec reaches for Selenium's post-hoc switch_to.alert. The gem cannot
    honour it: Lightpanda arms a dialog response before the action that opens
    it, so there is nothing to accept afterwards, and the gem raises
    NotSupportedByDriverError pointing at accept_alert/accept_confirm. Fails by
    design. Solidus's split-shipment spec hits it once the optgroup bug (fixed
    upstream in #3058) no longer stops the flow earlier.
  patterns:
    - "undefined method [`']switch_to"
    - 'post-hoc switch_to\.alert'

select2-v3-flow:
  confidence: confirmed
  summary: >-
    The taxons picker is a select2 v3 MULTI select that already holds a
    choice. CLICK_JS's wrapper descent (wishlist C13) takes the first visible
    child at every level: ul.select2-choices -> li.select2-search-choice (the
    existing choice) -> its div. select2's multi initContainer deliberately
    ignores clicks inside .select2-search-choice, so the drop never opens and
    no /api/taxons search is sent. Chrome's centred click lands on the empty
    ul or the search input. Traced locally on 11912 (2026-11-08).
    Gem fix: in the descent, stop once a node below the clicked element has
    more than one visible child (the first step still descends, so the
    single-select container -> a.select2-choice path is unchanged). Patched at
    runtime, the select2 step passes and spec/features/admin (338) shows no
    regression. The spec then still fails on
    `find(".edit_product", obscured: false)`: Lightpanda's approximate layout
    gives the form height 5 at top 1300 (block height excludes children), so
    isObscured sees its centre off-viewport. That second part is upstream
    geometry.
  reference: "wishlist C13"
  next_step: >-
    Land the CLICK_JS descent fix with a feature test (multi select2 with a
    preselected choice); the entry stays red on the faux-layout obscured
    check until upstream sizes blocks from their children.
  patterns:
    - 'select2-input|select2-focused|select2-drop'

decidim-account-js:
  confidence: confirmed
  summary: >-
    Not visibility: both "Remove" buttons are real. upload_field.js preloads
    the existing avatar on page load with an async `await fetch(img.src)`
    before `items.push`; the modal button re-runs preloadFiles while
    `items.length === 0`. Lightpanda's visit returns before that fetch lands
    (~40 ms later: images are not loaded, so no <img> holds back the load
    event as in Chrome), the spec clicks at once, and the avatar is preloaded
    twice (blobs/redirect + disk requested twice; 2 <li data-filename> items).
    A 2 s sleep before the click gives one item and passes. load_images: true
    does not close the race (3/5 still Ambiguous). Booted locally on 1.0.3
    (2026-11-08). Behind it, "can update avatar" also needs
    `li progress[value='100']`, set only from xhr.upload progress events,
    which Lightpanda never fires (webapi/net/XMLHttpRequestUpload.zig at
    d2f387cae; no upstream issue).
  next_step: >-
    Gem option to settle the network briefly after visit (bounded, never
    raising; LP.waitUntil networkalmostidle above 11698), decided against its
    cost on long-polling pages. Upstream: dispatch upload
    loadstart/progress/load/loadend from XMLHttpRequest.send.
  patterns:
    - 'account_spec\.rb # Account when on the account page update avatar'

campfire-clipboard-event:
  confidence: confirmed
  summary: >-
    Campfire's paste helper builds `new ClipboardEvent("paste", …)` from
    execute_script, and Lightpanda has no ClipboardEvent constructor
    (ReferenceError on 1.0.0 and nightly 10552). DataTransfer exists since
    #2671, so only the event interface is missing. Still absent at upstream
    d2f387cae (11912), with no issue or PR filed (checked 2026-11-08). Fix
    belongs upstream, not in a gem polyfill: a webapi/event/ClipboardEvent.zig
    modelled on DragEvent.zig (an Event carrying a nullable DataTransfer).
  next_step: >-
    File the upstream issue + PR (lightpanda-upstream-pr skill).
  patterns:
    - 'ClipboardEvent is not defined'

campfire-lexxy-composer-state:
  confidence: confirmed
  summary: >-
    Event-loop ordering, upstream. Lexxy defines its custom elements in
    `setTimeout(defineElements, 0)`; Campfire's Stimulus controllers load via
    `import()` of modulepreloaded modules. Lightpanda resolves `import()` of an
    already-fetched/evaluated module in microtasks
    (ScriptManagerBase.getAsyncImport `.done` branch, and the evaluated-cache
    hit in js/Context.zig _dynamicModuleCallback), so the composer controller
    connects before the timer: `#restoreDraft` sets `.value` on a
    not-yet-upgraded <lexxy-editor> and `selection.placeCursorAtTheEnd()`
    throws ("Error connecting controller TypeError"). Chrome delivers the
    import a task later, after the timer. Forcing defineElements synchronous
    makes the test pass. Reproduced on 1.0.3 and 11912 with a standalone
    timer-vs-import page (2026-11-08). Secondary: module/defer scripts see
    readyState "loading" instead of "interactive" (set only in
    ScriptManager.tailHook). No gem fix: the driver cannot reorder the page's
    event loop.
  next_step: >-
    File upstream: post the cached dynamic-import resolution as a 0 ms
    scheduler task; separate issue for readyState during deferred scripts.
  patterns:
    - 'test_an_unsent_message_is_kept_as_a_draft'
