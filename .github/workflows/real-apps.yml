name: Real-apps smoke test

# Re-runs the local swap-and-test exercise on CI. For each target Rails OSS
# project, this workflow:
#   1. Checks out capybara-lightpanda (this repo)
#   2. Checks out the target repo at the SHA the patch was generated against
#   3. Applies .github/real-apps/patches/<target>.patch (after sed-substituting
#      __CAPYBARA_LIGHTPANDA_PATH__ with the runner-side checkout path)
#   4. Installs the project's deps and runs the same spec subset as the local run
#   5. Compares failures against .github/real-apps/baselines/<target>.txt —
#      known failures (Lightpanda limitations) don't fail the job, only NEW
#      failures do; baseline entries that now pass surface as warnings.
#
# Trigger with `workflow_dispatch` to run a subset, or wait for the weekly cron.

on:
  workflow_dispatch:
    inputs:
      targets:
        description: "Comma-separated list of targets (forem,solidus,spree,decidim,mastodon,alonetone) or 'all'"
        default: "all"
        type: string
  schedule:
    # Weekly Monday 06:00 UTC — catches Lightpanda nightly regressions.
    - cron: "0 6 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    # NOTE: `matrix` context is not available in job-level `if:`, so per-target
    # filtering happens in the "Should this matrix entry run?" step below; every
    # later step is gated on `steps.guard.outputs.skip != 'true'`.
    strategy:
      fail-fast: false
      matrix:
        include:
          # work_dir = directory containing the Gemfile bundler should use
          #            (also where `bundle install` / `bundle exec` run).
          # spec_dir = directory rspec runs from. May differ from work_dir —
          #            Solidus bundles from the umbrella Gemfile at root but
          #            runs admin specs from backend/.
          - name: forem
            repo: forem/forem
            sha: 3a22391a6d83ee1fda6a185799c86dcb76800318
            # Forem's Gemfile reads .ruby-version (patched to 3.3.9) and
            # demands an exact match, so pin Ruby to that version exactly
            # rather than letting setup-ruby resolve "3.3" to the latest patch.
            ruby: "3.3.9"
            node: "20"
            work_dir: "."
            spec_dir: "."
            db_create: true
            # `yarn build` populates app/assets/builds/ via esbuild — Forem's
            # Sprockets manifest.js does `link_tree ../builds`, which dies if
            # the directory doesn't exist. Locally this runs automatically
            # under bin/dev / Spring; on CI we trigger it explicitly.
            #
            # `assets:precompile` then fingerprints the Sprockets bundles
            # (base.js etc.) so they're served statically rather than
            # live-compiled on first request. Forem's test env inherits
            # config.assets.compile = true, so base.js is NOT a 404 — but the
            # first page that needs it eats a full Sprockets compile (the
            # initializer adds node_modules to the asset path, so honeybadger/
            # ahoy compile too). That latency can exceed wait_for_javascript's
            # window (it polls for the base.js global `initializeBaseApp`) and
            # time out — the homepage-with-announcement spec. `|| true` falls
            # back to live compilation if precompile fails, so this can only
            # help or be neutral, never break the job. Unverified fix: the
            # baseline diff on the next real-apps run is the validation.
            pre_spec: "yarn build && (bundle exec rails assets:precompile || true)"
            # ~228 examples; locally ~89% pass (24 fails in comment-tree /
            # announcement-banner visibility + 1 file-upload limitation).
            spec: "spec/system/homepage spec/system/comments spec/system/articles spec/system/authentication"
          - name: solidus
            repo: solidusio/solidus
            sha: 57280f7b79a9829a77f1e3555ea24c98fafb7327
            ruby: "3.3"
            node: ""
            # Umbrella Gemfile at root; the dummy-app generator is in backend/Rakefile.
            work_dir: "."
            spec_dir: "backend"
            db_create: false
            pre_spec: "bundle exec rake -f backend/Rakefile test_app"
            # Full admin features suite: ~338 examples, locally ~77% pass
            # (~77 fails clustered on select2 autocomplete + file uploads).
            spec: "spec/features/admin"
          - name: spree
            repo: spree/spree
            sha: 3548616e242ca2eb43acbc81c338f8f618143e4d
            ruby: "3.3"
            node: ""
            # Spree's repo has a nested layout: the clone root has no Gemfile.
            # spree/admin/Gemfile is what the patch modifies.
            work_dir: "spree/admin"
            spec_dir: "spree/admin"
            db_create: false
            pre_spec: "bundle exec rake test_app"
            # Curated subset: avoid the 16-min full-features run. Mix of
            # cleanly-passing files (getting_started, settings) plus the
            # NoExecutionContextError-prone customers_spec for regression signal.
            spec: "spec/features/spree/admin/getting_started_spec.rb spec/features/spree/admin/settings spec/features/spree/admin/api_keys_spec.rb spec/features/spree/admin/products/option_types_spec.rb spec/features/spree/admin/customers_spec.rb"
          - name: decidim
            repo: decidim/decidim
            sha: d22e3584e07045fea4f1c759454cbfd5478168e7
            ruby: "3.4"
            node: "22"
            work_dir: "."
            spec_dir: "decidim-core"
            # The rake task creates the dummy app and runs its migrations itself,
            # so the workflow-level `db:create db:schema:load` step is skipped.
            # Generator outputs to `decidim-core/spec/decidim_dummy_app`, but the
            # spec_helper expects `target/spec/decidim_dummy_app` (resolved as
            # `../spec/decidim_dummy_app` from cwd=decidim-core). Move it.
            db_create: false
            pre_spec: "cd decidim-core && bundle exec rake decidim:generate_external_test_app && mkdir -p ../spec && rm -rf ../spec/decidim_dummy_app && mv spec/decidim_dummy_app ../spec/decidim_dummy_app"
            # accesslist locally was 4/4. Adding account_spec for an extra signal
            # without pulling in authentication_spec (28/46 fails — too noisy).
            spec: "spec/system/accesslist_spec.rb spec/system/account_spec.rb"
          - name: mastodon
            repo: mastodon/mastodon
            sha: 8bbde181db0d6d79018fb1754a8296e753d47415
            ruby: "4.0"
            node: "24"
            work_dir: "."
            spec_dir: "."
            db_create: true
            extra_apt: "libidn11-dev"
            # Most of Mastodon's :js specs are also :streaming-tagged and need
            # the Node streaming server (skipped here). Without --tag js, all
            # of home_spec + log_in_spec + log_out_spec run — a mix of rack_test
            # baselines and the few :js specs that don't need streaming.
            spec: "spec/system/home_spec.rb spec/system/log_in_spec.rb spec/system/log_out_spec.rb"
          - name: alonetone
            repo: sudara/alonetone
            sha: 7545c99d66853ca6e92354c064008890f4be0f6f
            ruby: "4.0"
            node: "22"
            work_dir: "."
            spec_dir: "."
            # MySQL app — the workflow's Postgres service is ignored. Uses the
            # runner's preinstalled mysql.service (root/root), which is exactly
            # what alonetone's database.example.yml test section expects, so no
            # MySQL service container is needed. db_create is false because
            # config/database.yml only exists after setup:copy_config.
            db_create: false
            # setup:touch_js stubs the gitignored MorphSVGPlugin.js (a paid GSAP
            # plugin alonetone's CI injects from a secret); app JS guards the
            # import, so an empty stub is fine. dartsass:build + yarn build
            # populate app/assets/builds for Propshaft before specs boot.
            pre_spec: "sudo systemctl start mysql.service && bin/rails setup:copy_config setup:touch_js db:create db:schema:load && bin/rails dartsass:build && yarn build"
            # All alonetone feature specs run on the swapped :alonetone driver
            # (it's the default_driver, not just the js one). Subset avoids the
            # UA-bot-gated paths (listens, signup via UsersController#create):
            # Lightpanda's UA has no whitelisted browser token and rejects
            # Mozilla-styled overrides, so PreventAbuse flags it as a bot.
            # audiowaveform (PPA package in alonetone's own CI) is only invoked
            # when processing uploaded audio — not needed for this subset.
            # account_requests is pinned to :4 (error-render example): the
            # success path renders 'thank_you' with status 303 and no Location
            # header, which Lightpanda's HTTP client aborts instead of
            # rendering (wishlist A43). Widen to the whole file on fix.
            spec: "spec/features/pages_spec.rb spec/features/account_requests_spec.rb:4 spec/features/users_spec.rb"

    name: ${{ matrix.name }}

    # Postgres and Redis services start for every matrix entry — the targets
    # that don't need them just ignore them. GitHub Actions can't gate services
    # on a per-matrix-entry condition.
    services:
      postgres:
        # pgvector/pgvector:pg16 is postgres:16 with the pgvector extension
        # pre-installed. Forem's schema.rb does `CREATE EXTENSION "vector"` at
        # db:schema:load time; vanilla postgres:16 doesn't ship vector.so.
        # The other targets don't use pgvector but the image is a drop-in
        # replacement.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      RAILS_ENV: test
      DISABLE_SPRING: "1"
      # libpq defaults: any Postgres client connection picks these up when the
      # app's database.yml leaves user/host/port unset (Decidim's generated
      # dummy app does this). Harmless for SQLite-only targets (Solidus, Spree).
      # IMPORTANT: do NOT set DATABASE_URL at job level — Rails treats it as an
      # absolute override, which forces Solidus's sqlite-configured dummy app
      # to try to load the `pg` adapter that isn't in its Gemfile.
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      # Mastodon's database.yml reads DB_* explicitly.
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_USER: postgres
      DB_PASS: postgres
      # Mastodon: skip Elasticsearch path.
      ES_ENABLED: "false"
      # Shared Redis URL — used by Forem, Decidim, and Mastodon. Apps that
      # don't speak Redis just ignore the var.
      REDIS_URL: "redis://localhost:6379"

    steps:
      - name: Should this matrix entry run?
        id: guard
        env:
          TARGETS: ${{ github.event.inputs.targets }}
          EVENT_NAME: ${{ github.event_name }}
          ENTRY_NAME: ${{ matrix.name }}
        run: |
          # Run if: scheduled, or no input given, or input is "all", or the
          # entry's name appears in the comma-separated `targets` input.
          # Spaces in the input are stripped so "forem, spree" still works.
          set -euo pipefail
          normalized=",${TARGETS// /},"
          if [ "$EVENT_NAME" = "schedule" ] || [ -z "$TARGETS" ] || [ "$TARGETS" = "all" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
          elif [[ "$normalized" == *",${ENTRY_NAME},"* ]]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
          else
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping ${ENTRY_NAME} (not in targets: ${TARGETS})"
          fi

      - name: Check out capybara-lightpanda
        if: steps.guard.outputs.skip != 'true'
        uses: actions/checkout@v7
        with:
          path: capybara-lightpanda

      - name: Check out ${{ matrix.repo }} @ ${{ matrix.sha }}
        if: steps.guard.outputs.skip != 'true'
        uses: actions/checkout@v7
        with:
          repository: ${{ matrix.repo }}
          ref: ${{ matrix.sha }}
          path: target

      - name: Install common OS deps
        if: steps.guard.outputs.skip != 'true'
        # libvips is loaded at Rails boot by every target via image_processing /
        # ruby-vips (Active Storage variants, file attachments, etc.). Ubuntu
        # 24.04 renames the runtime package to libvips42t64 (time64 migration);
        # 22.04 still has libvips42 — try the new name first, fall back.
        run: |
          sudo apt-get update
          sudo apt-get install -y libvips42t64 \
            || sudo apt-get install -y libvips42 \
            || sudo apt-get install -y libvips

      - name: Install extra OS deps
        if: steps.guard.outputs.skip != 'true' && matrix.extra_apt != ''
        run: sudo apt-get install -y ${{ matrix.extra_apt }}

      - name: Set per-target env overrides
        if: steps.guard.outputs.skip != 'true'
        run: |
          set -euo pipefail
          case "${{ matrix.name }}" in
            forem)
              # Forem reads these via ApplicationConfig (env-backed). It DOES
              # use DATABASE_URL itself, so it's set here (Forem-only) rather
              # than at job level where it'd shadow other apps' database.yml.
              {
                echo "DATABASE_URL=postgresql://postgres:postgres@localhost:5432/Forem_development"
                echo "DATABASE_URL_TEST=postgresql://postgres:postgres@localhost:5432/Forem_test"
                echo "DATABASE_NAME=Forem_development"
                echo "DATABASE_NAME_TEST=Forem_test"
                echo "APP_PROTOCOL=http://"
                echo "APP_DOMAIN=localhost:3000"
                echo "COMMUNITY_NAME=DEV(local)"
                echo "DEFAULT_EMAIL=yo@dev.to"
                echo "FOREM_OWNER_SECRET=secret"
                echo "SESSION_KEY=_Dev_Community_Session"
                echo "SESSION_EXPIRY_SECONDS=1209600"
              } >> "$GITHUB_ENV"
              ;;
          esac

      - name: Set up Ruby
        if: steps.guard.outputs.skip != 'true'
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          working-directory: target/${{ matrix.work_dir }}
          # No bundler-cache: the Gemfile is about to change, so the cache
          # checksum would no longer reflect the actual lock state.
          bundler-cache: false

      - name: Set up Node
        if: steps.guard.outputs.skip != 'true' && matrix.node != ''
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      - name: Apply patch
        if: steps.guard.outputs.skip != 'true'
        env:
          PATCH_NAME: ${{ matrix.name }}.patch
        run: |
          set -euo pipefail
          PATCH="capybara-lightpanda/.github/real-apps/patches/$PATCH_NAME"
          if [ ! -f "$PATCH" ]; then
            echo "Missing patch: $PATCH"
            exit 1
          fi
          sed "s|__CAPYBARA_LIGHTPANDA_PATH__|$GITHUB_WORKSPACE/capybara-lightpanda|g" "$PATCH" > /tmp/swap.patch
          git -C target apply --reject --whitespace=fix /tmp/swap.patch
          echo "--- Patch applied. Modified files: ---"
          git -C target diff --name-only

      - name: Configure idn-ruby native build (Mastodon)
        if: steps.guard.outputs.skip != 'true' && matrix.name == 'mastodon'
        working-directory: target/${{ matrix.work_dir }}
        run: bundle config set build.idn-ruby --with-idn-dir=/usr

      - name: Bundle install
        if: steps.guard.outputs.skip != 'true'
        working-directory: target/${{ matrix.work_dir }}
        run: bundle install --jobs 4 --retry 3

      - name: Enable corepack
        if: steps.guard.outputs.skip != 'true' && matrix.node != ''
        run: corepack enable

      - name: Yarn install
        if: steps.guard.outputs.skip != 'true' && matrix.node != ''
        working-directory: target/${{ matrix.work_dir }}
        run: |
          set -euo pipefail
          if [ ! -f package.json ]; then
            echo "No package.json — skipping yarn install."
            exit 0
          fi
          if grep -q '"packageManager"' package.json; then
            # Yarn Berry — corepack uses the version from package.json
            yarn install --immutable
          elif [ -f yarn.lock ]; then
            yarn install --frozen-lockfile || yarn install
          else
            echo "package.json present but no yarn.lock — skipping (assume npm/none)."
          fi

      - name: Create DB + load schema
        if: steps.guard.outputs.skip != 'true' && matrix.db_create
        working-directory: target/${{ matrix.work_dir }}
        run: bundle exec rails db:create db:schema:load

      - name: Pre-spec hook
        if: steps.guard.outputs.skip != 'true' && matrix.pre_spec != ''
        working-directory: target/${{ matrix.work_dir }}
        run: ${{ matrix.pre_spec }}

      - name: Determine Lightpanda cache key
        if: steps.guard.outputs.skip != 'true'
        id: lightpanda-cache-key
        # Fold the gem's minimum build into the key so a MINIMUM_NIGHTLY_BUILD
        # bump invalidates the cache — otherwise restore-keys resurrects a
        # sub-floor binary the gem then rejects with BinaryError. The gem is
        # checked out under capybara-lightpanda/ in this workflow.
        run: |
          echo "floor=$(grep 'MINIMUM_NIGHTLY_BUILD = Gem::Version' capybara-lightpanda/lib/capybara/lightpanda/process.rb | grep -oE '[0-9]+')" >> "$GITHUB_OUTPUT"
          echo "today=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Cache Lightpanda nightly binary
        if: steps.guard.outputs.skip != 'true'
        uses: actions/cache@v6
        with:
          path: ~/.cache/lightpanda
          key: lightpanda-${{ runner.os }}-${{ steps.lightpanda-cache-key.outputs.floor }}-${{ steps.lightpanda-cache-key.outputs.today }}
          restore-keys: |
            lightpanda-${{ runner.os }}-${{ steps.lightpanda-cache-key.outputs.floor }}-

      - name: Pre-provision Lightpanda binary
        if: steps.guard.outputs.skip != 'true'
        # The target apps run their system specs under WebMock/VCR with real
        # net connections disabled. The gem otherwise downloads the Lightpanda
        # nightly lazily on first use — inside the spec run — which raises
        # WebMock::NetConnectNotAllowedError (mastodon/forem/decidim) or, on a
        # GitHub blip, BinaryNotFoundError (solidus saw a 504). Fetch the binary
        # HERE, in a clean Ruby process with no WebMock loaded, so it is present
        # before the spec run. The Run spec step then sets LIGHTPANDA_CACHE_TIME=0
        # so the present binary is treated as fresh and never re-fetched.
        #
        # Default freshness is kept HERE (not 0): on a cross-day cache restore the
        # cached binary is >24h old, so this re-downloads the latest nightly —
        # the whole point of the scheduled smoke test. Retries absorb GitHub 5xx.
        run: |
          set -euo pipefail
          ok=
          for attempt in 1 2 3; do
            if ruby -I capybara-lightpanda/lib \
                 -r capybara/lightpanda/errors -r capybara/lightpanda/binary \
                 -e 'puts "Provisioned: #{Capybara::Lightpanda::Binary.update}"'; then
              ok=1
              break
            fi
            echo "Pre-provision attempt $attempt failed; retrying in 5s..." >&2
            sleep 5
          done
          [ -n "$ok" ] || { echo "Could not provision Lightpanda binary after 3 attempts" >&2; exit 1; }

      - name: Run spec
        if: steps.guard.outputs.skip != 'true'
        working-directory: target/${{ matrix.spec_dir }}
        # LIGHTPANDA_CACHE_TIME=0 makes the gem treat the pre-provisioned binary
        # as always fresh, so it never re-downloads mid-spec — even for examples
        # that travel the clock (forem's "when a year has passed" moves Time.now
        # forward a year, which would otherwise age the cached binary past the
        # freshness window and trigger a WebMock-blocked download).
        env:
          LIGHTPANDA_CACHE_TIME: "0"
        # `--format progress` keeps dot/F output compact while the trailing
        # failure block still prints full backtraces. The JSON report feeds
        # the baseline comparison below — known failures (Lightpanda
        # limitations like the layout-measuring-JS cluster) live in
        # .github/real-apps/baselines/<target>.txt and don't fail the job;
        # only NEW failures do. `|| true` defers pass/fail to that step.
        run: |
          bundle exec rspec ${{ matrix.spec }} --format progress \
            --format json --out "$GITHUB_WORKSPACE/rspec-report.json" || true

      - name: Compare failures against baseline
        if: steps.guard.outputs.skip != 'true'
        run: ruby capybara-lightpanda/.github/real-apps/check_baseline.rb ${{ matrix.name }} "$GITHUB_WORKSPACE/rspec-report.json"

      - name: Upload rspec report
        if: always() && steps.guard.outputs.skip != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: rspec-report-${{ matrix.name }}
          path: rspec-report.json
          if-no-files-found: ignore

      - name: Upload screenshots on failure
        if: failure() && steps.guard.outputs.skip != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: screenshots-${{ matrix.name }}
          path: |
            target/**/tmp/screenshots/**
            target/**/tmp/capybara/**
          if-no-files-found: ignore

      - name: Upload patch-reject hunks on failure
        if: failure() && steps.guard.outputs.skip != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: patch-rejects-${{ matrix.name }}
          path: |
            target/**/*.rej
          if-no-files-found: ignore

  # Rolls every target's baseline comparison up into one job summary, so a
  # single view shows whether the commit fixed (or regressed) any known
  # failures across all real-app targets — without opening each matrix leg.
  # `if: always()` so the roll-up still renders when a leg failed (which is
  # exactly when you want to see what got fixed despite a regression elsewhere).
  aggregate:
    needs: smoke
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check out capybara-lightpanda
        uses: actions/checkout@v7
        with:
          path: capybara-lightpanda

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          working-directory: capybara-lightpanda

      # Each matrix leg uploads rspec-report-<target>; pull them all into one
      # dir, preserving the per-artifact subdirectory the aggregator globs for
      # (rspec-report-<target>/rspec-report.json).
      - name: Download rspec reports
        uses: actions/download-artifact@v8
        with:
          pattern: rspec-report-*
          path: reports

      - name: Aggregate baselines
        # GITHUB_WORKSPACE is set by Actions; the aggregator passes it through to
        # check_baseline.rb so gem-sourced absolute file_paths normalize the same
        # way they did in the matrix legs. Informational — non-zero exit here is
        # redundant with the per-target gate, so don't fail the run on it.
        run: ruby capybara-lightpanda/.github/real-apps/aggregate_baseline.rb reports || true
