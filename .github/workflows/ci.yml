name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    if: ${{ !contains(github.event.pull_request.title, '[ci skip]') && !contains(github.event.pull_request.title, '[skip ci]') }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.3", "4.0"]
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - uses: oven-sh/setup-bun@v2
        with:
          # Pin to the same Bun the harness pins locally (test/js/.bun-version,
          # mirrored by package.json's packageManager field). Keeps CI on the
          # same post-Zig→Rust-rewrite build the predicate tests are validated
          # against, so local and CI never drift to different Bun cores.
          bun-version-file: test/js/.bun-version
      - name: Determine Lightpanda cache key
        id: lightpanda-cache-key
        # Fold the gem's minimum build into the key so a MINIMUM_NIGHTLY_BUILD
        # bump invalidates the cache — otherwise restore-keys resurrects a
        # sub-floor binary the gem then rejects with BinaryError.
        run: |
          echo "floor=$(grep 'MINIMUM_NIGHTLY_BUILD = Gem::Version' lib/capybara/lightpanda/process.rb | grep -oE '[0-9]+')" >> "$GITHUB_OUTPUT"
          echo "today=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
      - name: Cache Lightpanda nightly binary
        uses: actions/cache@v6
        with:
          path: ~/.cache/lightpanda
          key: lightpanda-${{ runner.os }}-${{ steps.lightpanda-cache-key.outputs.floor }}-${{ steps.lightpanda-cache-key.outputs.today }}
          restore-keys: |
            lightpanda-${{ runner.os }}-${{ steps.lightpanda-cache-key.outputs.floor }}-
      - name: Lint
        run: bundle exec rubocop
      - name: JS predicate tests (Bun harness)
        # Fast (~0.1s) unit tests for the injected _lightpanda predicate logic
        # (visibleText whitespace/block rules, contenteditable/disabled walks).
        # Dev-only harness under test/js/; not part of the shipped gem.
        run: bundle exec rake test:js
      - name: Tests (unit + features)
        # test:all = test/**/*_test.rb — includes the per-fix regression files
        # under test/features/ (turbo_load, drop, teardown, upstream_bugs, …)
        # that previously never ran in CI.
        run: bundle exec rake test:all
      - name: Cache examples' inline-bundle gems
        uses: actions/cache@v6
        with:
          path: ~/.cache/example-bundles
          key: example-bundles-${{ runner.os }}-${{ matrix.ruby }}-${{ hashFiles('examples/**/*.rb') }}
          restore-keys: |
            example-bundles-${{ runner.os }}-${{ matrix.ruby }}-
      - name: Examples
        env:
          EXAMPLES_BUNDLE_PATH: ~/.cache/example-bundles
        run: bundle exec rake examples:all

  # Guards the *release* channel, which every other job leaves untested: they all
  # run the rolling nightly. Tagged releases print a bare "0.3.5" with no commit
  # counter, so they take a different branch of check_minimum_version — and when
  # that branch was missing, the gem rejected every stable release for months
  # without any CI noticing. Boot the pinned release the gem claims to support
  # and run the driver suite against it.
  release-channel:
    if: ${{ !contains(github.event.pull_request.title, '[ci skip]') && !contains(github.event.pull_request.title, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - name: Resolve the supported release floor
        id: floor
        run: |
          echo "release=$(grep 'MINIMUM_RELEASE = Gem::Version' lib/capybara/lightpanda/process.rb | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')" >> "$GITHUB_OUTPUT"
      - name: Cache the pinned release binary
        uses: actions/cache@v6
        with:
          # Keyed by version alone — a tagged release is immutable, so unlike the
          # nightly cache this never needs a date component.
          path: ~/.cache/lightpanda-release
          key: lightpanda-release-${{ runner.os }}-${{ steps.floor.outputs.release }}
      - name: Download the pinned release
        env:
          RELEASE: ${{ steps.floor.outputs.release }}
        run: |
          set -euo pipefail
          BIN="$HOME/.cache/lightpanda-release/lightpanda-$RELEASE"
          if [ -x "$BIN" ]; then
            echo "Cached $RELEASE already present."
          else
            mkdir -p "$(dirname "$BIN")"
            curl -fsSL --retry 3 --retry-delay 5 \
              "https://github.com/lightpanda-io/browser/releases/download/$RELEASE/lightpanda-x86_64-linux" \
              -o "$BIN"
            chmod +x "$BIN"
          fi
          echo "LIGHTPANDA_BIN=$BIN" >> "$GITHUB_ENV"
      - name: Assert the binary reports the pinned release
        # Catches a mis-tagged or redirected asset before the suite blames the driver.
        run: |
          set -euo pipefail
          actual="$("$LIGHTPANDA_BIN" version)"
          echo "lightpanda version → $actual"
          [ "$actual" = "${{ steps.floor.outputs.release }}" ] || {
            echo "Expected ${{ steps.floor.outputs.release }}, got $actual" >&2; exit 1; }
      - name: Driver suite against the pinned release
        run: bundle exec rake test

  capybara-specs:
    if: github.event_name == 'push'
    needs: check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.3", "4.0"]
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Determine Lightpanda cache key
        id: lightpanda-cache-key
        # Fold the gem's minimum build into the key so a MINIMUM_NIGHTLY_BUILD
        # bump invalidates the cache — otherwise restore-keys resurrects a
        # sub-floor binary the gem then rejects with BinaryError.
        run: |
          echo "floor=$(grep 'MINIMUM_NIGHTLY_BUILD = Gem::Version' lib/capybara/lightpanda/process.rb | grep -oE '[0-9]+')" >> "$GITHUB_OUTPUT"
          echo "today=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
      - name: Cache Lightpanda nightly binary
        uses: actions/cache@v6
        with:
          path: ~/.cache/lightpanda
          key: lightpanda-${{ runner.os }}-${{ steps.lightpanda-cache-key.outputs.floor }}-${{ steps.lightpanda-cache-key.outputs.today }}
          restore-keys: |
            lightpanda-${{ runner.os }}-${{ steps.lightpanda-cache-key.outputs.floor }}-
      - name: Capybara shared specs (parallel workers)
        # Each worker boots its own Lightpanda on an OS-assigned port, so this
        # continuously exercises the port-0 ephemeral path (#72) under real
        # concurrency — and roughly halves the job's wall clock.
        run: bundle exec rake spec:shared:parallel
      - name: Print worker logs on failure
        if: failure()
        run: cat tmp/spec_parallel/worker_*.log
