name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    if: ${{ !contains(github.event.pull_request.title, '[ci skip]') && !contains(github.event.pull_request.title, '[skip ci]') }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.3", "4.0"]
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Determine Lightpanda cache key
        id: lightpanda-cache-key
        # Fold the gem's minimum build into the key so a MINIMUM_NIGHTLY_BUILD
        # bump invalidates the cache — otherwise restore-keys resurrects a
        # sub-floor binary the gem then rejects with BinaryError.
        run: |
          echo "floor=$(grep 'MINIMUM_NIGHTLY_BUILD = Gem::Version' lib/capybara/lightpanda/process.rb | grep -oE '[0-9]+')" >> "$GITHUB_OUTPUT"
          echo "today=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
      - name: Cache Lightpanda nightly binary
        uses: actions/cache@v5
        with:
          path: ~/.cache/lightpanda
          key: lightpanda-${{ runner.os }}-${{ steps.lightpanda-cache-key.outputs.floor }}-${{ steps.lightpanda-cache-key.outputs.today }}
          restore-keys: |
            lightpanda-${{ runner.os }}-${{ steps.lightpanda-cache-key.outputs.floor }}-
      - name: Lint
        run: bundle exec rubocop
      - name: Unit tests
        run: bundle exec rake test:unit
      - name: Cache examples' inline-bundle gems
        uses: actions/cache@v5
        with:
          path: ~/.cache/example-bundles
          key: example-bundles-${{ runner.os }}-${{ matrix.ruby }}-${{ hashFiles('examples/**/*.rb') }}
          restore-keys: |
            example-bundles-${{ runner.os }}-${{ matrix.ruby }}-
      - name: Examples
        env:
          EXAMPLES_BUNDLE_PATH: ~/.cache/example-bundles
        run: bundle exec rake examples:all

  capybara-specs:
    if: github.event_name == 'push'
    needs: check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.3", "4.0"]
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Determine Lightpanda cache key
        id: lightpanda-cache-key
        # Fold the gem's minimum build into the key so a MINIMUM_NIGHTLY_BUILD
        # bump invalidates the cache — otherwise restore-keys resurrects a
        # sub-floor binary the gem then rejects with BinaryError.
        run: |
          echo "floor=$(grep 'MINIMUM_NIGHTLY_BUILD = Gem::Version' lib/capybara/lightpanda/process.rb | grep -oE '[0-9]+')" >> "$GITHUB_OUTPUT"
          echo "today=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
      - name: Cache Lightpanda nightly binary
        uses: actions/cache@v5
        with:
          path: ~/.cache/lightpanda
          key: lightpanda-${{ runner.os }}-${{ steps.lightpanda-cache-key.outputs.floor }}-${{ steps.lightpanda-cache-key.outputs.today }}
          restore-keys: |
            lightpanda-${{ runner.os }}-${{ steps.lightpanda-cache-key.outputs.floor }}-
      - name: Capybara shared specs
        run: bundle exec rake spec:shared
